services:
  cowrie:
    image: cowrie/cowrie:latest
    ports:
      - "22:2222"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
    restart: unless-stopped

  ollama-fake:
    build: ./ollama-fake
    ports:
      - "11434:11434"
    volumes:
      - ollama-logs:/logs
    restart: unless-stopped

volumes:
  cowrie-var:
  ollama-logs: